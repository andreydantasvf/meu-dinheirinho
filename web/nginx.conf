server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router client-side routes (e.g. /extrato) have no matching file on disk —
    # fall back to index.html so the app's own router handles them instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
