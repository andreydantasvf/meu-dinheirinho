services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: ./web/.env
    ports:
      - '5173:5173'
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # Production stage, only started via `docker compose --profile prod up --build`.
  api-prod:
    profiles: ['prod']
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '3000:3000'
    volumes:
      - api-data:/app/prisma

  web-prod:
    profiles: ['prod']
    build:
      context: ./web
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api-prod

volumes:
  api-data:
