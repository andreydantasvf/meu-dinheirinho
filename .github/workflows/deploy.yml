name: Deploy

on:
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'file:./prisma/dev.db'
      AUTH_PASSWORD: 'test-password'
      AUTH_TOKEN_SECRET: 'test-token-secret-min-32-chars-long-for-hmac'
      WEBAUTHN_RP_ID: 'localhost'
      WEBAUTHN_RP_NAME: 'Meu Dinheirinho Test'
      WEBAUTHN_ORIGIN: 'http://localhost:5173'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Build (demo)
        run: pnpm build:demo

  # Vercel deploys the web/ frontend itself via its native GitHub integration
  # (configured once during Vercel project setup — see docs/deployment.md).
  # No Vercel step belongs here.
  deploy-backend:
    needs: [backend-ci, web-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          curl --fail -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN"
